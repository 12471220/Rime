patch:
  style/text_orientation: horizontal   # 控制文字方向
  style/candidate_list_layout: linear   # 控制候选词横向排列
  style/corner_radius: 0
  # style/font_point: 14
  # style/border_width: 1
  # style/border_height: 1

  style/color_scheme: scs_dark

  preset_color_schemes/+:
    scs_dark:
      name: sc's dark color scheme
      author: sc
      back_color: 0x252a2e    # 候选条背景色，24位色值，16进制，BGR顺序
      border_color: 0x444444    # 边框色
      text_color: 0x424242    # 拼音行文字颜色
      hilited_back_color: 0xD75A00    # 第一候选项背景背景色
      hilited_candidate_text_color: 0xFFFFFF    # 高亮候选项文字颜色
      hilited_candidate_label_color: 0xCCCCCC   # 高亮候选项编号颜色
      hilited_comment_text_color: 0x999999    # 注解文字高亮
      hilited_corner_radius: 0    # 高亮圆角
      # hilited_text_color: 0x999999    # 高亮拼音 (需要开启内嵌编码)
      candidate_text_color: 0xcccccc    # 非高亮候选项文字颜色
      label_color: 0xaaaaaa             # 非高亮候选项编号颜色
      comment_text_color: 0x888888    # 五笔提示文字颜色
      inline_preedit: true    # 单行显示，false双行显示
      candidate_format: "[label]. [candidate] [comment]"
      font_face: "Avenir"
      font_point: 14    # fontsize
      #label_font_face: "SFCompactText-Regular"  # 候选词编号字体
      label_font_point: 12    # 候选编号大小
      corner_radius: 0    # 候选条圆角
      border_height: 1     # 窗口上下高度
      border_width: 1   # 窗口左右宽度
      border_color_width: 0   #输入条边框宽度
