patch:
  switches:
    - name: ascii_mode
      reset: 0
      states: [ 五, en ]
    - name: full_shape
      states: [ 半, 全 ]
    - name: extended_charset
      states: [ normal, extended ]
    - name: ascii_punct
      states: [ 。，, ．， ]
      
  ascii_composer/switch_key/Shift_L: commit_code
  ascii_composer/switch_key/Shift_R: commit_code